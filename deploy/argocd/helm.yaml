apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tvguide
  namespace: argocd
spec:
  project: default
  source:
    # bjw-s app-template: https://bjw-s-labs.github.io/helm-charts/docs/app-template/
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.3.0
    helm:
      releaseName: tvguide
      valuesObject:
        controllers:
          main:
            containers:
              main:
                image:
                  repository: ghcr.io/thekoma/hdhomerunepgxml
                  tag: 2026.11.0
                env:
                  # The address of your HDHomeRun tuner.
                  HDHOMERUN_HOST: 10.0.1.2
                  HDHOMERUN_DEBUG_MODE: "off"
                probes:
                  liveness:
                    enabled: true
                    type: HTTP
                    path: /healthcheck
                    port: 8000
                  readiness:
                    enabled: true
                    type: HTTP
                    path: /healthcheck
                    port: 8000
                resources:
                  requests:
                    cpu: 50m
                    memory: 192Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL

        defaultPodOptions:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        service:
          main:
            controller: main
            ports:
              http:
                port: 8000

        persistence:
          # The SQLite cache (/data/epg_cache.db). It refills on its own, so an
          # emptyDir is enough. To keep it across restarts, use a
          # persistentVolumeClaim instead.
          data:
            type: emptyDir
          # SQLite writes temporary files here, for example when the cache is cleared.
          tmp:
            type: emptyDir

        # The service has no authentication. Keep it on your LAN, or put it behind an
        # authenticating proxy before you expose it.
        ingress:
          main:
            enabled: false
            className: nginx
            hosts:
              - host: tvguide.example.com
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: main
                      port: http

  destination:
    server: https://kubernetes.default.svc
    namespace: tvguide

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
